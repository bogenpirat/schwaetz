name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint, test & build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cache Ergo test server
        uses: actions/cache@v6
        with:
          path: tests/ergo/bin
          key: ergo-${{ hashFiles('tests/ergo/VERSION') }}

      - name: Test (with a local Ergo IRC server for end-to-end tests)
        shell: pwsh
        run: |
          $ergo = & ./tests/ergo/start.ps1 -Port 16667
          $env:SCHWAETZ_ERGO_PORT = "16667"
          try { cargo test --workspace; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          finally { $ergo | Stop-Process -Force -ErrorAction SilentlyContinue }

      - name: Build release
        run: cargo build --release --bin schwaetz

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: schwaetz-${{ github.sha }}-x86_64
          path: target/release/schwaetz.exe
          retention-days: 7
