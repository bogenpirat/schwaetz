[package]
name = "schwaetz-script"
description = "JavaScript/TypeScript scripting host (QuickJS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["typescript"]
typescript = ["dep:oxc_allocator", "dep:oxc_parser", "dep:oxc_transformer", "dep:oxc_codegen", "dep:oxc_semantic", "dep:oxc_span"]

[dependencies]
schwaetz-core.workspace = true
schwaetz-proto.workspace = true
schwaetz-client.workspace = true
schwaetz-net.workspace = true
toml.workspace = true
rquickjs = { version = "0.14", default-features = false, features = ["classes", "properties"] }
oxc_allocator = { version = "0.151", optional = true }
oxc_parser = { version = "0.151", optional = true }
oxc_transformer = { version = "0.151", optional = true }
oxc_codegen = { version = "0.151", optional = true }
oxc_semantic = { version = "0.151", optional = true }
oxc_span = { version = "0.151", optional = true }
tracing.workspace = true
