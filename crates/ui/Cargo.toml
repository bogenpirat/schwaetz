[package]
name = "schwaetz-ui"
description = "Native Win32 + Direct2D user interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
schwaetz-proto.workspace = true
schwaetz-client.workspace = true
schwaetz-net.workspace = true
schwaetz-core.workspace = true
serde.workspace = true
toml.workspace = true
linkify.workspace = true
tracing.workspace = true
windows-numerics = "0.3"
